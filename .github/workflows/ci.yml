name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    uses: Sagargupta16/shared-workflows/.github/workflows/node-ci.yml@main
    with:
      working-directory: frontend
      run-lint: false # pre-existing lint errors; re-enable once cleaned up
  security:
    uses: Sagargupta16/shared-workflows/.github/workflows/security-scan.yml@main
    permissions:
      contents: read
      security-events: write
