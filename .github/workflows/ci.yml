name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    uses: Sagargupta16/shared-workflows/.github/workflows/node-ci.yml@main
    permissions:
      contents: read
    with:
      working-directory: frontend
      node-version: "24.x" # match deploy-frontend.yml
      tests-before-build: true
  security:
    uses: Sagargupta16/shared-workflows/.github/workflows/security-scan.yml@main
    permissions:
      contents: read
      security-events: write
